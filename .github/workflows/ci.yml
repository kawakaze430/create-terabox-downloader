name: Platform CI
on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_managed_source:
        description: Verify downloads against the commit-pinned repository HTTPS source
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.lock
      - run: PYTHONPATH=services/api python -m pytest -q services/api/tests
      - run: python -m pip check
      - name: Validate permanent Word project archive
        run: python docs/verify_handoff_archive.py
      - name: Verify offline operator preflight (no live network)
        run: |
          set +e
          PYTHONPATH=services/api python -m app.preflight > /tmp/terabox_preflight.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/terabox_preflight.json").read_text())
          assert report["live_verified"] is False
          assert report["public_provider_enabled"] is False
          print("Offline preflight checked; configuration_ready:", report["configuration_ready"])
          PY
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.lock
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Verify the opt-in local transfer fixture
        env:
          NEXT_PUBLIC_ENABLE_TRANSFER_FIXTURE: '1'
        run: |
          npm run build
          npm run test:e2e -- fixture-transfer.spec.ts
        working-directory: apps/web
      - name: Verify managed downloads
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://127.0.0.1:8000'
          NEXT_PUBLIC_ENABLE_MANAGED_TRANSFERS: '1'
        run: |
          npm run build
          npm run test:e2e -- managed-transfers.spec.ts
          npm run test:e2e -- --config playwright.managed.config.ts
        working-directory: apps/web
      - name: Verify the live repository HTTPS source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_managed_source }}
        env:
          MANAGED_E2E_LIVE: '1'
        run: npm run test:e2e -- --config playwright.managed.config.ts
        working-directory: apps/web
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/extension/popup.js
      - run: node --test apps/extension/tests/*.test.mjs
      - run: node -e "const m=require('./apps/extension/manifest.json'); if(m.manifest_version!==3)process.exit(1)"
