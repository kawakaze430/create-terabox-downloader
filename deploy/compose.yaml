services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --forwarded-allow-ips
      - ${PROXY_IP:-172.31.240.2}
      - --no-access-log
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      NO_PROXY: localhost,127.0.0.1,::1,api,web
    networks:
      backend:
        ipv4_address: ${PROXY_IP:-172.31.240.2}
    ports:
      - "${INGRESS_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${INGRESS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  backend:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.240.0/28}
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.31.240.8/29}

volumes:
  caddy-data:
  caddy-config:
